# spring.jpa.hibernate.ddl-auto=update

# =============================================
# AMBIENTE DE DESENVOLVIMENTO (H2)
# =============================================
spring.datasource.url=jdbc:h2:mem:growthdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 CONSOLE
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA HIBERNATE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SWAGGER
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =============================================
# RATE LIMITING (BUCKET4J) - Configuração Simplificada
# =============================================
bucket4j.enabled=true
bucket4j.filters[0].cache-name=buckets # O nome do cache ainda é necessário
bucket4j.filters[0].url=^/api/.*
bucket4j.filters[0].strategy=local # Usando o cache local em memória, sem dependências externas
bucket4j.filters[0].rate-limit.bandwidth[0].capacity=20
bucket4j.filters[0].rate-limit.bandwidth[0].time=1
bucket4j.filters[0].rate-limit.bandwidth[0].unit=minutes
